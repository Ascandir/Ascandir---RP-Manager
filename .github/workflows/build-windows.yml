name: Windows-Installer bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Installer als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Ascandir-Galaxiekarte-Setup
          path: dist/*.exe
      - name: Release anlegen (nur bei Versions-Tags wie v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
