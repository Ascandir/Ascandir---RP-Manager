name: Windows-Installer bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version aus package.json lesen
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$V" >/dev/null 2>&1; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi

      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Ascandir-InteractiveMap-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      # Neue Versionsnummer in package.json => Tag vX.Y.Z + Release mit Installer automatisch anlegen
      - name: Tag und Release anlegen
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ascandir InteractiveMap v${{ steps.ver.outputs.version }}
          body: |
            Windows-Installer: `Ascandir-InteractiveMap-Setup-${{ steps.ver.outputs.version }}.exe` herunterladen und ausführen.
            Bereits installierte Versionen ab 0.2.0 melden das Update automatisch.
            Gespeicherte Welten und Zeitlinien im Ordner `data` bleiben bei einem Update erhalten.
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
