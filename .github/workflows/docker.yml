name: Docker-Image bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ascandir/ascandir---swgm:latest
            ghcr.io/ascandir/ascandir---swgm:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Ascandir/Ascandir---SWGM
            org.opencontainers.image.title=Ascandir InteractiveMap
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
