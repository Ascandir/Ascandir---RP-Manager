<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b111c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self';">
  <title>Ascandir – RP-Manager</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="scifi">
  <header id="topbar">
    <div class="brand"><span class="logo"></span>Ascandir <span class="dim">· RP-Manager</span></div>
    <div class="tl-controls">
      <select id="worldSelect" data-i18n-title="world"></select>
      <select id="tlSelect" data-i18n-title="timeline"></select>
      <button id="btnTools" class="fixed" data-i18n-title="tipTools">⚙</button>
      <span id="tlTools" class="tl-tools" hidden>
        <button id="btnNewWorld" data-i18n="newWorld"></button>
        <button id="btnDelWorld" data-i18n="deleteWorld"></button>
        <button id="btnNewTl" data-i18n="btnNew" data-i18n-title="tipNew"></button>
        <button id="btnDupTl" data-i18n="btnCopy" data-i18n-title="tipCopy"></button>
        <button id="btnDelTl" data-i18n-title="tipDelete">🗑</button>
        <span class="menu">
          <button id="btnFile"><span data-i18n="file"></span> ▾</button>
          <div class="menu-list" id="fileMenu" hidden>
            <button id="btnExport" data-i18n="btnExport" data-i18n-title="tipExport"></button>
            <button id="btnImport" data-i18n="btnImport" data-i18n-title="tipImport"></button>
            <button id="btnJson" data-i18n="btnJson" data-i18n-title="tipJson"></button>
            <button id="btnFolder" data-i18n="btnFolder" data-i18n-title="tipFolder"></button>
          </div>
        </span>
      </span>
      <input type="file" id="fileImport" accept=".json,.geojson,application/json,application/geo+json" hidden>
    </div>
    <div class="mode-tabs">
      <button id="btnLogin" hidden></button>
      <button id="btnUser" hidden></button>
      <span class="menu" id="modeMenuWrap">
        <button id="btnModes" class="fixed"></button>
        <div class="menu-list mode-list" id="modeMenu" hidden>
          <button id="tabView" data-i18n="tabView"></button>
          <button id="tabEdit" data-i18n="tabEdit"></button>
          <button id="tabStory" data-i18n="tabStory"></button>
          <button id="tabChars" data-i18n="tabChars"></button>
          <button id="tabWorld" data-i18n="tabWorld"></button>
          <button id="tabSettings" data-i18n="tabSettings"></button>
          <div class="menu-sep"></div>
          <div class="lang-switch" id="langSwitch"><button data-l="de">DE</button><button data-l="en">EN</button></div>
        </div>
      </span>
    </div>
  </header>

  <aside id="left">
    <section>
      <h3 data-i18n="search"></h3>
      <input id="search" list="searchList" data-i18n-ph="searchPh">
      <datalist id="searchList"></datalist>
    </section>
    <section>
      <button id="btnPlanner" class="wide planner-btn"></button>
      <div id="planner" hidden></div>
    </section>
    <section class="lfold folded">
      <h3 class="ltg" data-i18n="objects"></h3>
      <div id="typeFilter"></div>
    </section>
    <section class="lfold folded">
      <h3 class="ltg" data-i18n="display"></h3>
      <label class="chk"><input type="checkbox" data-opt="influence"><span data-i18n="optInfluence"></span></label>
      <label class="chk"><input type="checkbox" data-opt="routes"><span id="lblRoutes"></span></label>
      <label class="chk sw-only"><input type="checkbox" data-opt="regions"><span data-i18n="optRegions"></span></label>
      <label class="chk sw-only"><input type="checkbox" data-opt="sectors"><span data-i18n="optSectors"></span></label>
      <label class="chk sw-only"><input type="checkbox" data-opt="atlas"><span data-i18n="optAtlas"></span></label>
      <label class="chk"><input type="checkbox" data-opt="grid"><span data-i18n="optGrid"></span></label>
      <label class="chk"><input type="checkbox" data-opt="names"><span data-i18n="optNames"></span></label>
    </section>
    <section class="grow lfold folded">
      <h3 class="ltg"><span data-i18n="factions"></span> <span class="mini-actions"><a href="#" id="facAll" data-i18n="all"></a> · <a href="#" id="facNone" data-i18n="none"></a></span></h3>
      <div id="factionFilter"></div>
      <p class="hint" data-i18n="factionsHint"></p>
    </section>
  </aside>

  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="mobBar">
      <button id="mobFilter" title="Filter">☰</button>
      <button id="mobPlanner" title="Reise">🧭</button>
      <button id="mobPanel" title="Info">ℹ</button>
    </div>
    <div id="tooltip" hidden></div>
    <div id="toolHint" hidden></div>
    <div id="updBanner" hidden></div>
    <div class="zoom-ctrl">
      <button id="zoomIn" data-i18n-title="zoomIn">＋</button>
      <button id="zoomOut" data-i18n-title="zoomOut">－</button>
      <button id="zoomFit" data-i18n-title="zoomFit">⌂</button>
    </div>
    <div id="settingsView" hidden></div>
  </main>

  <div id="backdrop" hidden></div>
  <aside id="right">
    <div class="sheet-handle"><span></span><button id="sheetClose">✕</button></div>
    <div id="story" hidden></div>
    <div id="chars" hidden></div>
    <div id="wnotes" hidden></div>
    <div id="editor" hidden></div>
    <div id="info"></div>
  </aside>

  <footer id="timebar">
    <div class="tb-left">
      <button id="eraPrev" data-i18n-title="prevEra">⏮</button>
      <button id="yearPrev" data-i18n-title="prevYear">◀</button>
      <input id="yearInput" data-i18n-ph="yearPh">
      <button id="yearNext" data-i18n-title="nextYear">▶</button>
      <button id="eraNext" data-i18n-title="nextEra">⏭</button>
      <span class="tb-sep"></span>
      <button id="trkIn" data-i18n-title="trkIn">🔍＋</button>
      <button id="trkOut" data-i18n-title="trkOut">🔍－</button>
      <button id="trkEra" data-i18n-title="trkEra" data-i18n="trkEraLbl"></button>
      <button id="trkAll" data-i18n-title="trkAll" data-i18n="trkAllLbl"></button>
    </div>
    <div id="trackWrap" data-i18n-title="trackHint"><canvas id="track"></canvas></div>
    <div class="era-info">
      <div><span id="eraName"></span> <span id="eraYear" class="year"></span></div>
      <div id="eraDesc"></div>
    </div>
  </footer>

  <div id="modal" hidden>
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel"></button>
        <button id="modalOk" class="primary"></button>
      </div>
    </div>
  </div>

  <script src="web-fs.js"></script>
  <script src="i18n.js"></script>
  <script src="planets.js"></script>
  <script src="territory.js"></script>
  <script src="travel.js"></script>
  <script src="worlds/starwars-atlas.js"></script>
  <script src="worlds/starwars.js"></script>
  <script src="worlds/starwars-facts.js"></script>
  <script src="app.js"></script>
</body>
</html>
